<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Festival Match</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            padding: 48px 20px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        .logo { font-size: 40px; margin-bottom: 12px; }

        h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #1DB954, #69e89b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 40px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #444;
            margin-bottom: 12px;
        }

        .festival-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 40px;
        }

        .festival-card {
            display: block;
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 18px 16px;
            text-decoration: none;
            color: white;
            transition: border-color 0.2s, background 0.2s;
        }

        .festival-card:hover {
            border-color: #1DB954;
            background: #181818;
        }

        .festival-card-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .festival-card-count {
            font-size: 12px;
            color: #555;
        }

        .divider {
            border: none;
            border-top: 1px solid #1a1a1a;
            margin: 36px 0;
        }

        .url-form {
            display: flex;
            gap: 10px;
        }

        .url-input {
            flex: 1;
            background: #141414;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 12px 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .url-input::placeholder { color: #444; }
        .url-input:focus { border-color: #1DB954; }

        .parse-btn {
            background: #1DB954;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .parse-btn:hover { background: #1aa34a; }

        .footer {
            margin-top: 48px;
            color: #333;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎪</div>
        <h1>Festival Match</h1>
        <p class="subtitle">See which festival artists match your Spotify taste</p>

        {% if festivals %}
        <p class="section-label">Choose a festival</p>
        <div class="festival-grid">
            {% for f in festivals %}
            <a href="/results/{{ f.slug }}" class="festival-card">
                <div class="festival-card-name">{{ f.name }}</div>
                <div class="festival-card-count">{{ f.count }} artists</div>
            </a>
            {% endfor %}
        </div>
        {% endif %}

        <hr class="divider">

        <p class="section-label">Add a festival from a URL</p>
        <form action="/parse" method="POST" class="url-form">
            <input type="url" name="url" class="url-input" placeholder="https://festival.com/lineup" required>
            <button type="submit" class="parse-btn">Parse Lineup</button>
        </form>

        <p class="footer">Clicking a festival will prompt you to connect Spotify if needed</p>
    </div>
</body>
</html>
